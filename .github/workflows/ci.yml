name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      docker_security_tests:
        description: "Run optional live Docker sandbox security tests"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --extra parsing
      - run: uv run ruff check src tests
      - run: uv run pytest

  docker-security:
    if: github.event_name != 'workflow_dispatch' || inputs.docker_security_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Configure live Docker test policy
        run: |
          mkdir -p .code-agent
          cat > .code-agent/policy.toml <<'EOF'
          [sandbox]
          rootless_required = false
          seccomp_required = true
          container_user = "65532:65532"

          [images]
          allowed = ["python:3.13-slim"]
          require_digest = true
          EOF
      - name: Prepare reviewed sandbox image
        run: docker pull python:3.13-slim
      - name: Inspect Docker sandbox health
        run: uv run code-agent sandbox health --backend docker
      - name: Run live Docker sandbox security tests
        run: uv run pytest tests/test_sandbox.py -m docker_security
