<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent47 • Authentication Complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* CSS_INJECTION_PLACEHOLDER */
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="container fade-in">
    <div class="card glass">
      <div class="icon-container scale-in">
        <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
          <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
          <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
      </div>
      
      <h1 class="title">Authentication Successful</h1>
      <p class="subtitle">You're signed in to Agent47.</p>
      
      <div class="profile-card">
        <div class="profile-label">Signed in as</div>
        <div class="profile-name">{{name}}</div>
        <div class="profile-email">{{email}}</div>
      </div>
    </div>
    
    <div class="footer">
      <p>You may now return to Agent47.</p>
      <p class="countdown-text" id="countdown-text">This window will close automatically.</p>
      <div class="countdown" id="countdown">Closing in 5...</div>
      
      <div class="logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
        <span>Agent47</span>
      </div>
    </div>
  </div>

  <script>
    /* JS_INJECTION_PLACEHOLDER */
  </script>
</body>
</html>
