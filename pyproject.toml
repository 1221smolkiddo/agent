[project]
name = "code-agent"
version = "0.1.0"
description = "A Python CLI-first coding agent with a reusable core for future editor integrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.84.0",
  "pydantic-settings>=2.8.0",
  "python-dotenv>=1.0.1",
  "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]
parsing = [
  "tree-sitter>=0.24.0",
  "tree-sitter-language-pack>=0.7.0",
]

[project.scripts]
code-agent = "code_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
