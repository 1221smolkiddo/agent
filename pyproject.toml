[project]
name = "agent47"
version = "0.1.0"
description = "A Python CLI-first coding agent with a reusable core for future editor integrations."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Agent47 contributors" },
]
keywords = ["ai", "coding-agent", "cli", "developer-tools", "agent47"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
]
dependencies = [
  "openai>=1.84.0",
  "keyring>=25.0.0",
  "prompt_toolkit>=3.0.0",
  "pydantic-settings>=2.8.0",
  "python-dotenv>=1.0.1",
  "rich>=15.0.0",
  "typer>=0.15.0",
]

[project.optional-dependencies]
hindsight = ["hindsight-client>=0.10.1,<0.11"]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]
parsing = [
  "tree-sitter>=0.24.0",
  "tree-sitter-language-pack>=0.7.0",
]

[project.scripts]
code-agent = "code_agent.cli:app"
agent47 = "code_agent.interactive:main"

[project.urls]
Homepage = "https://github.com/1221smolkiddo/agent"
Documentation = "https://github.com/1221smolkiddo/agent#readme"
Issues = "https://github.com/1221smolkiddo/agent/issues"
Changelog = "https://github.com/1221smolkiddo/agent/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "**/.code-agent/**",
  "**/.venv/**",
  "**/.git",
  "**/.git/**",
  "**/__pycache__/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.mypy_cache/**",
  "**/node_modules/**",
  "**/*.pyc",
  "**/*.db",
  "**/*.sqlite",
  "**/*.sqlite3",
  "**/.env",
  "**/.env.*",
  "!/.env.example",
  "/debug_run_eval*.py",
  "/debug_workspace/**",
  "/docs/qualification/**",
  "/dist/**",
  "/build/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "docker_security: optional live Docker sandbox security tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "twine>=6.2.0",
]
